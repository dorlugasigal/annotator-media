<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moodboard (fictional sample)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1580px; height:690px; overflow:hidden; background:transparent; }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color:#1a1d24; -webkit-font-smoothing:antialiased; }
  .win { position:absolute; inset:0; background:#faf8f5; display:grid; grid-template-rows:40px 64px 1fr; }
  .bar { display:flex; align-items:center; gap:18px; padding:0 16px; background:#f0ede8; border-bottom:1px solid #e6e1d9; }
  .dots { display:flex; gap:8px; } .dots i { width:12px; height:12px; border-radius:50%; display:block; }
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .title { margin:0 auto; font-size:13px; font-weight:600; color:#5b5f69; }
  .tools { display:flex; align-items:center; gap:10px; padding:0 28px; }
  .tools h1 { font-size:24px; font-weight:760; letter-spacing:-.03em; margin-right:18px; }
  .pill { font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; background:#fff; border:1px solid #e6e1d9; color:#4b505b; }
  .pill.on { background:#1a1d24; color:#fff; border-color:#1a1d24; }
  .search { margin-left:auto; width:260px; height:34px; border-radius:10px; background:#fff; border:1px solid #e6e1d9; font-size:13px; color:#9a9fa9; display:flex; align-items:center; padding:0 12px; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:1fr 1fr; gap:18px; padding:4px 28px 26px; min-height:0; }
  figure { position:relative; border-radius:16px; overflow:hidden; background:#ddd; box-shadow:0 1px 0 #0000000d, 0 10px 24px #3b2f1f14; }
  figure svg { width:100%; height:100%; display:block; }
  figcaption { position:absolute; left:10px; bottom:10px; font-size:12px; font-weight:700; color:#fff; background:#151820b3; padding:5px 10px; border-radius:999px; backdrop-filter:blur(6px); }
  .star { position:absolute; right:10px; top:10px; font-size:11px; font-weight:800; background:#fff; color:#1a1d24; padding:4px 9px; border-radius:999px; }
</style>
</head>
